
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060915">
    <title>Buy Airtime | Bigotic Data</title>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        (function () {
            try {
                const saved = localStorage.getItem('bigotic-theme');
                document.documentElement.setAttribute(
                    'data-theme',
                    saved === 'light' ? 'light' : 'dark'
                );
            } catch (_) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <style>
        :root {
            --electric: #3b6bff;
            --electric-soft: #7c9bff;
            --cyan: #28e0d6;
            --emerald: #34d399;
            --rose: #f97066;
            --gold: #f4b740;
        }

        html[data-theme="dark"] {
            --bg: #060915;
            --bg-elevated: #0d1330;
            --card: #0f1638;
            --card-2: linear-gradient(165deg, #121a42, #0d1330);
            --border: rgba(148, 163, 255, .14);
            --text-hi: #eef1ff;
            --text-mid: #aab0d6;
            --text-dim: #6b71a0;
            --nav-bg: rgba(6, 9, 21, .78);
            --shadow: 0 20px 45px -14px rgba(0, 0, 0, .5);
            --row-hover: rgba(124, 155, 255, .07);
            --input-bg: rgba(255, 255, 255, .04);
        }

        html[data-theme="light"] {
            --bg: #f2f4fb;
            --bg-elevated: #fff;
            --card: #fff;
            --card-2: linear-gradient(165deg, #fff, #f6f8ff);
            --border: #e6e9f6;
            --text-hi: #0f1428;
            --text-mid: #5b6178;
            --text-dim: #98a0c2;
            --nav-bg: rgba(255, 255, 255, .85);
            --shadow: 0 20px 45px -20px rgba(30, 58, 138, .14);
            --row-hover: rgba(59, 107, 255, .05);
            --input-bg: #f5f7fd;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-hi);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 110px;
            transition: background .35s ease, color .35s ease;
        }

        .font-display { font-family: 'Space Grotesk', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 40;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            background: var(--nav-bg);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--text-mid);
            font-size: 12px;
            font-weight: 700;
        }

        .back-btn i { width: 16px; height: 16px; }

        .topbar-title {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .1em;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .theme-quick {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--card);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-mid);
        }

        main {
            max-width: 460px;
            margin: 0 auto;
            padding: 20px 18px 0;
        }

        .top-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 18px;
        }

        .auto-badge {
            font-size: 9.5px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .05em;
            background: var(--row-hover);
            color: var(--text-mid);
            padding: 5px 12px;
            border-radius: 999px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: var(--shadow);
            padding: 22px;
            margin-bottom: 18px;
        }

        .field-label {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--electric-soft);
            margin: 0 0 10px;
            display: block;
        }

        .network-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 9px;
            margin-bottom: 20px;
        }

        .network-card {
            border: 1.5px solid var(--border);
            border-radius: 14px;
            padding: 13px 4px;
            text-align: center;
            background: var(--input-bg);
            cursor: pointer;
            transition: all .2s cubic-bezier(.16, 1, .3, 1);
        }

        .network-card span {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: -.01em;
            color: var(--text-mid);
        }

        .network-card.active {
            border-color: var(--electric);
            background: rgba(59, 107, 255, .12);
            transform: scale(.97);
            box-shadow: 0 8px 18px -6px rgba(59, 107, 255, .35);
        }

        .network-card.active span { color: var(--electric-soft); }

        .network-card:focus-visible,
        .chip:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--electric-soft);
            outline-offset: 3px;
        }

        .input-wrap {
            position: relative;
            margin-bottom: 8px;
        }

        .input-wrap input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 13px;
            padding: 14px 42px 14px 15px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-hi);
            outline: none;
            font-family: 'JetBrains Mono', monospace;
            transition: border-color .2s ease;
        }

        .input-wrap input:focus { border-color: var(--electric-soft); }

        .input-wrap i.field-ic {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 17px;
            height: 17px;
            color: var(--text-dim);
            pointer-events: none;
        }

        .input-wrap .ngn-tag {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 9.5px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .04em;
            background: var(--row-hover);
            color: var(--text-mid);
            padding: 4px 8px;
            border-radius: 7px;
            pointer-events: none;
        }

        .carrier-note {
            display: none;
            align-items: center;
            gap: 8px;
            margin: 10px 0 18px;
            padding: 9px 12px;
            border-radius: 11px;
            background: rgba(52, 211, 153, .1);
            border: 1px solid rgba(52, 211, 153, .25);
            font-size: 10.5px;
            font-weight: 700;
            color: var(--emerald);
        }

        .carrier-note .sub {
            display: block;
            font-size: 9px;
            font-weight: 600;
            color: var(--text-dim);
            margin-top: 1px;
        }

        .chip-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 9px;
            margin: 16px 0 4px;
        }

        .chip {
            padding: 10px 4px;
            text-align: center;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            font-size: 11px;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-mid);
            cursor: pointer;
            transition: all .2s ease;
        }

        .chip:hover { border-color: var(--electric-soft); }

        .chip.active {
            background: linear-gradient(135deg, var(--electric), #1d3fbf);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 8px 18px -6px rgba(59, 107, 255, .45);
        }

        .submit-btn {
            width: 100%;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, var(--electric), #1d3fbf);
            color: #fff;
            padding: 16px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .06em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            box-shadow: 0 16px 34px -10px rgba(59, 107, 255, .45);
            transition: transform .2s ease, opacity .2s ease;
        }

        .submit-btn:hover:not(:disabled) { transform: translateY(-2px); }

        .submit-btn:disabled {
            opacity: .7;
            cursor: progress;
        }

        .spinner {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, .35);
            border-top-color: #fff;
            animation: spin .7s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .bottom-nav-wrap {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 45;
            padding: 0 16px 16px;
        }

        .bottom-nav {
            max-width: 460px;
            margin: 0 auto;
            background: var(--nav-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 20px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            box-shadow: 0 -14px 34px -14px rgba(0, 0, 0, .25);
        }

        .bnav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 56px;
            color: var(--text-dim);
            gap: 3px;
        }

        .bnav-item.active { color: var(--electric-soft); }
        .bnav-item i { width: 16px; height: 16px; }

        .bnav-item span {
            font-size: 8px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        .bnav-center { position: relative; top: -16px; }

        .bnav-center .glow {
            position: absolute;
            inset: 0;
            background: var(--electric);
            border-radius: 14px;
            filter: blur(10px);
            opacity: .45;
        }

        .bnav-center a {
            position: relative;
            width: 50px;
            height: 50px;
            border-radius: 15px;
            background: linear-gradient(135deg, var(--electric), #1d3fbf);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: 0 10px 24px rgba(59, 107, 255, .4);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 90;
            background: rgba(3, 5, 14, .62);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .28s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            width: 100%;
            max-width: 330px;
            background: var(--card-2);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 28px;
            text-align: center;
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, .5);
            transform: translateY(18px) scale(.96);
            transition: transform .32s cubic-bezier(.16, 1, .3, 1);
            position: relative;
            overflow: hidden;
        }

        .modal-overlay.open .modal-card {
            transform: translateY(0) scale(1);
        }

        .modal-icon {
            width: 52px;
            height: 52px;
            border-radius: 15px;
            background: rgba(59, 107, 255, .14);
            color: var(--electric-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
        }

        .modal-card h3 {
            font-size: 16px;
            font-weight: 700;
            margin: 0 0 6px;
        }

        .modal-card p {
            font-size: 11.5px;
            color: var(--text-mid);
            line-height: 1.6;
            margin: 0 0 18px;
        }

        .pin-dots {
            display: flex;
            gap: 11px;
            justify-content: center;
            margin-bottom: 16px;
        }

        .pin-dots span {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--border);
            transition: background .2s ease, transform .2s ease;
        }

        .pin-dots span.filled {
            background: var(--electric);
            transform: scale(1.15);
        }

        .modal-card input.pin-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-size: 10.5px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .05em;
            border: none;
            cursor: pointer;
        }

        .confirm-btn {
            background: linear-gradient(135deg, var(--electric), #1d3fbf);
            color: #fff;
        }

        .cancel-btn {
            background: var(--row-hover);
            color: var(--text-mid);
        }

        .modal-actions button:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        .result-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: rgba(52, 211, 153, .16);
        }

        .result-icon::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            opacity: .5;
            animation: pulse-ring 1.8s ease-out infinite;
        }

        @keyframes pulse-ring {
            0% { opacity: .5; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.4); }
        }

        .result-btn {
            width: 100%;
            border: none;
            cursor: pointer;
            padding: 13px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: #fff;
            background: linear-gradient(135deg, var(--emerald), #1fae7d);
        }

        #toastContainer {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 99;
            display: flex;
            flex-direction: column;
            gap: 11px;
            max-width: 340px;
            width: calc(100% - 36px);
            pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-start;
            gap: 11px;
            padding: 15px 16px 14px;
            border-radius: 16px;
            background: var(--card-2);
            border: 1px solid var(--border);
            box-shadow: 0 24px 55px -16px rgba(0, 0, 0, .35);
            transform: translateY(-14px) scale(.96);
            opacity: 0;
            transition: transform .38s cubic-bezier(.16, 1, .3, 1), opacity .3s ease;
        }

        .toast.show {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .toast::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, var(--rose), #c8362a);
        }

        .toast::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            height: 2px;
            width: 100%;
            background: linear-gradient(90deg, var(--rose), transparent);
            transform-origin: left;
            animation: toast-countdown 3.6s linear forwards;
        }

        .toast:hover::after { animation-play-state: paused; }

        @keyframes toast-countdown {
            from { transform: scaleX(1); }
            to { transform: scaleX(0); }
        }

        .toast .icon {
            width: 31px;
            height: 31px;
            border-radius: 10px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(249, 112, 102, .16);
            color: var(--rose);
        }

        .toast .title {
            margin: 0 0 2px;
            font-size: 10.5px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .toast p.msg {
            margin: 0;
            font-size: 11.5px;
            font-weight: 500;
            color: var(--text-mid);
            line-height: 1.5;
        }

        .toast .dismiss {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: 3px;
            border-radius: 6px;
            flex-shrink: 0;
        }

        @media (max-width: 360px) {
            main { padding-left: 12px; padding-right: 12px; }
            .card { padding: 17px; }
            .network-grid, .chip-row { gap: 6px; }
            .topbar { padding: 0 12px; }
            .topbar-title { font-size: 10px; }
        }
    </style>
</head>

<body>
    <nav class="topbar">
        <a href="dashboard.html" class="back-btn">
            <i data-lucide="arrow-left"></i> Dashboard
        </a>

        <div class="topbar-title">
            <i data-lucide="phone" style="width:14px;height:14px;color:var(--electric-soft);"></i>
            Buy Airtime
        </div>

        <button type="button" class="theme-quick" id="themeToggle" aria-label="Toggle theme">
            <i data-lucide="sun-moon" id="themeIconTop" style="width:15px;height:15px;"></i>
        </button>
    </nav>

    <div id="toastContainer" aria-live="polite" aria-atomic="false"></div>

    <main>
        <div class="top-row">
            <span class="auto-badge">Instant delivery</span>
        </div>

        <form id="airtimeForm">
            <div class="card">
                <label class="field-label">Select mobile carrier</label>

                <div class="network-grid" id="networkGrid">
                    <button type="button" class="network-card" data-value="MTN" aria-pressed="false"><span>MTN</span></button>
                    <button type="button" class="network-card" data-value="AIRTEL" aria-pressed="false"><span>AIRTEL</span></button>
                    <button type="button" class="network-card" data-value="GLO" aria-pressed="false"><span>GLO</span></button>
                    <button type="button" class="network-card" data-value="9MOBILE" aria-pressed="false"><span>9MOBILE</span></button>
                </div>

                <label class="field-label" for="phone">Recipient phone number</label>
                <div class="input-wrap">
                    <input
                        type="tel"
                        id="phone"
                        required
                        placeholder="08012345678"
                        maxlength="11"
                        minlength="11"
                        inputmode="numeric"
                        autocomplete="tel"
                    >
                    <i data-lucide="smartphone" class="field-ic"></i>
                </div>

                <div class="carrier-note" id="carrierNote">
                    <i data-lucide="check-circle-2" style="width:14px;height:14px;"></i>
                    <span>
                        Carrier detected: <strong id="carrierName">&mdash;</strong>
                        <span class="sub">Override above if this number was ported</span>
                    </span>
                </div>

                <label class="field-label" for="amount">Recharge amount (₦)</label>
                <div class="input-wrap">
                    <input
                        type="number"
                        id="amount"
                        required
                        min="100"
                        step="1"
                        placeholder="Minimum ₦100"
                        inputmode="numeric"
                    >
                    <span class="ngn-tag">NGN</span>
                </div>

                <div class="chip-row">
                    <button type="button" class="chip" data-amt="100" onclick="selectChip(this,100)">₦100</button>
                    <button type="button" class="chip" data-amt="200" onclick="selectChip(this,200)">₦200</button>
                    <button type="button" class="chip" data-amt="500" onclick="selectChip(this,500)">₦500</button>
                    <button type="button" class="chip" data-amt="1000" onclick="selectChip(this,1000)">₦1,000</button>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
                <span id="submitBtnLabel">Purchase airtime</span>
            </button>
        </form>
    </main>

    <div id="pinGateModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="pinModalTitle">
        <div class="modal-card">
            <div class="modal-icon">
                <i data-lucide="lock" style="width:20px;height:20px;"></i>
            </div>

            <h3 class="font-display" id="pinModalTitle">Security verification</h3>
            <p>Enter your 4-digit transaction PIN to finalize this purchase.</p>

            <form id="pinAuthForm">
                <div class="pin-dots" id="pinDots" aria-hidden="true">
                    <span></span><span></span><span></span><span></span>
                </div>

                <input
                    type="password"
                    id="txPin"
                    class="pin-input"
                    maxlength="4"
                    minlength="4"
                    pattern="[0-9]{4}"
                    inputmode="numeric"
                    autocomplete="off"
                    aria-label="Four-digit transaction PIN"
                    required
                >

                <div class="modal-actions">
                    <button type="submit" id="confirmPayBtn" class="confirm-btn">Confirm</button>
                    <button type="button" id="cancelPinBtn" class="cancel-btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div id="successResponseModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="successTitle">
        <div class="modal-card">
            <div class="result-icon">
                <i data-lucide="check-circle-2" style="width:26px;height:26px;color:var(--emerald);"></i>
            </div>

            <h3 class="font-display" id="successTitle">Purchase successful!</h3>
            <p id="successModalMsg">Your airtime has been dispatched.</p>

            <button type="button" id="successAcknowledgeBtn" class="result-btn">Acknowledge</button>
        </div>
    </div>

    <div class="bottom-nav-wrap">
        <div class="bottom-nav">
            <a href="buy-airtime.html" class="bnav-item active" aria-current="page">
                <i data-lucide="phone"></i><span>Airtime</span>
            </a>
            <a href="buy-data.html" class="bnav-item">
                <i data-lucide="wifi"></i><span>Data</span>
            </a>
            <div class="bnav-center">
                <div class="glow"></div>
                <a href="dashboard.html" aria-label="Home">
                    <i data-lucide="home" style="width:20px;height:20px;"></i>
                </a>
            </div>
            <a href="history.html" class="bnav-item">
                <i data-lucide="clock"></i><span>History</span>
            </a>
            <a href="settings.html" class="bnav-item">
                <i data-lucide="settings"></i><span>Settings</span>
            </a>
        </div>
    </div>

    <script>
        if (window.lucide) {
            lucide.createIcons();
        }

        const airtimeForm = document.getElementById('airtimeForm');
        const submitBtn = document.getElementById('submitBtn');
        const submitBtnLabel = document.getElementById('submitBtnLabel');
        const phoneInput = document.getElementById('phone');
        const amountInput = document.getElementById('amount');
        const carrierNote = document.getElementById('carrierNote');
        const carrierNameEl = document.getElementById('carrierName');
        const pinGateModal = document.getElementById('pinGateModal');
        const pinAuthForm = document.getElementById('pinAuthForm');
        const txPinInput = document.getElementById('txPin');
        const confirmPayBtn = document.getElementById('confirmPayBtn');
        const successResponseModal = document.getElementById('successResponseModal');

        let selectedNetwork = null;
        let isProcessing = false;

        // These IDs preserve the values used by the existing backend.
        // Verify them against the MobileSub API documentation before changing them.
        const networkIds = {
            MTN: 1,
            AIRTEL: 2,
            GLO: 3,
            '9MOBILE': 4
        };

        const networkPrefixes = {
            MTN: [
                '0803', '0806', '0810', '0813', '0814', '0816',
                '0903', '0906', '0913', '0916', '0703', '0706',
                '0704', '0901'
            ],
            AIRTEL: [
                '0802', '0808', '0812', '0902', '0907',
                '0912', '0911', '0708', '0701'
            ],
            GLO: [
                '0805', '0807', '0811', '0815',
                '0905', '0915', '0705'
            ],
            '9MOBILE': [
                '0809', '0817', '0818', '0909', '0908'
            ]
        };

        function applyThemeIcon() {
            const isLight =
                document.documentElement.getAttribute('data-theme') === 'light';

            const icon = document.getElementById('themeIconTop');

            if (icon) {
                icon.setAttribute('data-lucide', isLight ? 'sun' : 'moon');
            }

            if (window.lucide) {
                lucide.createIcons();
            }
        }

        function toggleTheme() {
            const current =
                document.documentElement.getAttribute('data-theme');

            const next = current === 'light' ? 'dark' : 'light';

            document.documentElement.setAttribute('data-theme', next);

            try {
                localStorage.setItem('bigotic-theme', next);
            } catch (_) {
                // Theme still changes for the current page session.
            }

            applyThemeIcon();
        }

        document.getElementById('themeToggle').addEventListener('click', toggleTheme);
        applyThemeIcon();

        function selectNetworkCard(value) {
            selectedNetwork = value;

            document.querySelectorAll('.network-card').forEach(card => {
                const active = card.dataset.value === value;
                card.classList.toggle('active', active);
                card.setAttribute('aria-pressed', String(active));
            });
        }

        document.querySelectorAll('.network-card').forEach(card => {
            card.addEventListener('click', () => {
                selectNetworkCard(card.dataset.value);
            });
        });

        function selectChip(el, amount) {
            document.querySelectorAll('.chip').forEach(chip => {
                const active = chip === el;
                chip.classList.toggle('active', active);
                chip.setAttribute('aria-pressed', String(active));
            });

            amountInput.value = amount;
        }

        document.querySelectorAll('.chip').forEach(chip => {
            chip.setAttribute('aria-pressed', 'false');
        });

        amountInput.addEventListener('input', () => {
            document.querySelectorAll('.chip').forEach(chip => {
                const active = Number(chip.dataset.amt) === Number(amountInput.value);
                chip.classList.toggle('active', active);
                chip.setAttribute('aria-pressed', String(active));
            });
        });

        phoneInput.addEventListener('input', function () {
            const phoneNumber = this.value.replace(/\D/g, '').slice(0, 11);

            if (this.value !== phoneNumber) {
                this.value = phoneNumber;
            }

            if (phoneNumber.length >= 4) {
                const prefix = phoneNumber.substring(0, 4);
                let detectedNetwork = null;

                for (const [network, prefixes] of Object.entries(networkPrefixes)) {
                    if (prefixes.includes(prefix)) {
                        detectedNetwork = network;
                        break;
                    }
                }

                if (detectedNetwork) {
                    carrierNameEl.textContent = detectedNetwork;
                    carrierNote.style.display = 'flex';

                    // Detect a likely network, but do not override a user's
                    // deliberate manual selection on every subsequent keystroke.
                    if (!selectedNetwork || selectedNetwork === detectedNetwork) {
                        selectNetworkCard(detectedNetwork);
                    }
                } else {
                    carrierNote.style.display = 'none';
                }
            } else {
                carrierNote.style.display = 'none';
            }
        });

        function showNotification(message, type = 'error') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');

            toast.className = 'toast';

            const iconName = type === 'success'
                ? 'check-circle-2'
                : 'alert-circle';

            const title = type === 'success'
                ? 'Success'
                : 'Something needs attention';

            const iconWrap = document.createElement('span');
            iconWrap.className = 'icon';

            const icon = document.createElement('i');
            icon.setAttribute('data-lucide', iconName);
            icon.style.width = '15px';
            icon.style.height = '15px';
            iconWrap.appendChild(icon);

            const content = document.createElement('div');
            content.style.flex = '1';

            const titleEl = document.createElement('p');
            titleEl.className = 'title';
            titleEl.textContent = title;

            const messageEl = document.createElement('p');
            messageEl.className = 'msg';
            messageEl.textContent = String(message);

            content.append(titleEl, messageEl);

            const dismiss = document.createElement('button');
            dismiss.type = 'button';
            dismiss.className = 'dismiss';
            dismiss.setAttribute('aria-label', 'Dismiss notification');

            const dismissIcon = document.createElement('i');
            dismissIcon.setAttribute('data-lucide', 'x');
            dismissIcon.style.width = '13px';
            dismissIcon.style.height = '13px';
            dismiss.appendChild(dismissIcon);

            toast.append(iconWrap, content, dismiss);
            container.appendChild(toast);

            if (window.lucide) {
                lucide.createIcons();
            }

            requestAnimationFrame(() => toast.classList.add('show'));

            let removed = false;
            let timer;

            const remove = () => {
                if (removed) return;
                removed = true;
                clearTimeout(timer);
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            };

            dismiss.addEventListener('click', remove);
            timer = setTimeout(remove, 3600);

            toast.addEventListener('mouseenter', () => clearTimeout(timer));
            toast.addEventListener('mouseleave', () => {
                if (!removed) timer = setTimeout(remove, 1200);
            });
        }

        function openPinGate() {
            if (isProcessing) return;

            txPinInput.value = '';
            updatePinDots();
            pinGateModal.classList.add('open');

            setTimeout(() => txPinInput.focus(), 200);
        }

        function closePinGate() {
            if (isProcessing) return;

            pinGateModal.classList.remove('open');
            txPinInput.value = '';
            updatePinDots();
        }

        document.getElementById('cancelPinBtn').addEventListener('click', closePinGate);

        function updatePinDots() {
            const value = txPinInput.value || '';

            document.querySelectorAll('#pinDots span').forEach((dot, index) => {
                dot.classList.toggle('filled', index < value.length);
            });
        }

        txPinInput.addEventListener('input', function () {
            this.value = this.value.replace(/\D/g, '').slice(0, 4);
            updatePinDots();
        });

        document.querySelector('#pinGateModal .modal-card').addEventListener('click', event => {
            if (event.target.closest('#pinDots')) {
                txPinInput.focus();
            }
        });

        function closeSuccessModal() {
            successResponseModal.classList.remove('open');
            window.location.href = 'dashboard.html';
        }

        document.getElementById('successAcknowledgeBtn')
            .addEventListener('click', closeSuccessModal);

        airtimeForm.addEventListener('submit', function (event) {
            event.preventDefault();

            if (isProcessing) return;

            const phone = phoneInput.value.trim();
            const amount = Number(amountInput.value);

            if (!selectedNetwork || !Object.hasOwn(networkIds, selectedNetwork)) {
                showNotification('Please select a mobile carrier.');
                return;
            }

            if (!/^0\d{10}$/.test(phone)) {
                showNotification('Please enter a valid 11-digit Nigerian phone number.');
                phoneInput.focus();
                return;
            }

            if (!Number.isSafeInteger(amount) || amount < 100) {
                showNotification('Minimum recharge amount is ₦100.');
                amountInput.focus();
                return;
            }

            if (amount > 1000000) {
                showNotification('Please contact support for airtime purchases above ₦1,000,000.');
                return;
            }

            openPinGate();
        });

        pinAuthForm.addEventListener('submit', async function (event) {
            event.preventDefault();

            if (isProcessing) return;

            const phone = phoneInput.value.trim();
            const amount = Number(amountInput.value);
            const pin = txPinInput.value;

            if (!/^\d{4}$/.test(pin)) {
                showNotification('Enter your 4-digit transaction PIN.');
                txPinInput.focus();
                return;
            }

            if (!selectedNetwork || !Object.hasOwn(networkIds, selectedNetwork)) {
                closePinGate();
                showNotification('Please select a mobile carrier.');
                return;
            }

            if (!/^0\d{10}$/.test(phone) || !Number.isSafeInteger(amount) || amount < 100) {
                closePinGate();
                showNotification('Check the phone number and recharge amount, then try again.');
                return;
            }

            let currentUser;

            try {
                currentUser = JSON.parse(localStorage.getItem('user') || 'null');
            } catch (_) {
                currentUser = null;
            }

            if (!currentUser || !currentUser.email) {
                closePinGate();
                showNotification('Your session has expired. Please log in again.');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1800);
                return;
            }

            isProcessing = true;
            pinGateModal.classList.remove('open');
            submitBtn.disabled = true;
            confirmPayBtn.disabled = true;
            document.getElementById('cancelPinBtn').disabled = true;

            submitBtnLabel.innerHTML =
                '<span class="spinner"></span> Processing…';

            confirmPayBtn.textContent = 'Processing…';

            let requestCompleted = false;

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 45000);

                let response;

                try {
                    response = await fetch(
                        'https://bigoticdata-backend.onrender.com/buy-airtime',
                        {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Accept': 'application/json'
                            },
                            body: JSON.stringify({
                                email: currentUser.email,
                                network: networkIds[selectedNetwork],
                                phone,
                                amount,
                                pin
                            }),
                            signal: controller.signal
                        }
                    );
                } finally {
                    clearTimeout(timeoutId);
                }

                let data;

                try {
                    data = await response.json();
                } catch (_) {
                    data = {};
                }

                requestCompleted = true;

                if (response.ok && data.success === true) {
                    if (Number.isFinite(Number(data.newBalance))) {
                        currentUser.balance = Number(data.newBalance);

                        try {
                            localStorage.setItem('user', JSON.stringify(currentUser));
                        } catch (_) {
                            // The server transaction remains authoritative.
                        }
                    }

                    document.getElementById('successModalMsg').textContent =
                        `₦${amount.toLocaleString('en-NG')} airtime was successfully processed for ${phone}.`;

                    successResponseModal.classList.add('open');
                    return;
                }

                if (
                    response.status >= 500 ||
                    data.code === 'PURCHASE_STATUS_UNCONFIRMED'
                ) {
                    showNotification(
                        'We could not confirm the transaction status. Check your transaction history before trying again.'
                    );
                } else {
                    showNotification(
                        data.error ||
                        data.message ||
                        'Airtime purchase failed. Please check your details and try again.'
                    );
                }
            } catch (error) {
                // A network timeout does not prove that the provider failed.
                showNotification(
                    'We could not confirm the result. Check your transaction history before attempting another purchase.'
                );
            } finally {
                isProcessing = false;
                submitBtn.disabled = false;
                confirmPayBtn.disabled = false;
                document.getElementById('cancelPinBtn').disabled = false;
                submitBtnLabel.textContent = 'Purchase airtime';
                confirmPayBtn.textContent = 'Confirm';
                txPinInput.value = '';
                updatePinDots();

                if (!successResponseModal.classList.contains('open')) {
                    pinGateModal.classList.remove('open');
                }
            }
        });

        window.addEventListener('load', function () {
            let user = null;

            try {
                user = JSON.parse(localStorage.getItem('user') || 'null');
            } catch (_) {
                user = null;
            }

            if (!user || !user.email) {
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
