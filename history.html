<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History | Bigotic Data</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        (function(){
            const saved = localStorage.getItem('bigotic-theme');
            document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
        })();
    </script>

    <style>
        :root{ --electric:#3b6bff; --electric-soft:#7c9bff; --cyan:#28e0d6; --emerald:#34d399; --rose:#f97066; --gold:#f4b740; }
        html[data-theme="dark"]{
            --bg:#060915; --bg-elevated:#0d1330; --card:#0f1638; --card-2:linear-gradient(165deg,#121a42,#0d1330);
            --border: rgba(148,163,255,0.14); --text-hi:#eef1ff; --text-mid:#aab0d6; --text-dim:#6b71a0;
            --nav-bg: rgba(6,9,21,0.78); --shadow: 0 20px 45px -14px rgba(0,0,0,.5);
            --row-hover: rgba(124,155,255,.07); --divider: rgba(148,163,255,0.1);
        }
        html[data-theme="light"]{
            --bg:#f2f4fb; --bg-elevated:#ffffff; --card:#ffffff; --card-2:linear-gradient(165deg,#ffffff,#f6f8ff);
            --border:#e6e9f6; --text-hi:#0f1428; --text-mid:#5b6178; --text-dim:#98a0c2;
            --nav-bg: rgba(255,255,255,.85); --shadow: 0 20px 45px -20px rgba(30,58,138,.14);
            --row-hover: rgba(59,107,255,.05); --divider: #eef0fa;
        }
        *{ box-sizing:border-box; }
        html, body{ margin:0; padding:0; }
        body{
            font-family:'Inter',sans-serif; background:var(--bg); color:var(--text-hi); min-height:100vh;
            overflow-x:hidden; padding-bottom:110px; transition: background .35s ease, color .35s ease;
        }
        .font-display{ font-family:'Space Grotesk',sans-serif; }
        .font-mono{ font-family:'JetBrains Mono',monospace; }
        a{ text-decoration:none; color:inherit; }
        button{ font-family:inherit; }
        @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

        .topbar{ position:sticky; top:0; z-index:40; height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 18px; background:var(--nav-bg); backdrop-filter:blur(14px); border-bottom:1px solid var(--border); }
        .back-btn{ display:flex; align-items:center; gap:7px; color:var(--text-mid); font-size:12px; font-weight:700; }
        .back-btn i{ width:16px; height:16px; }
        .topbar-title{ font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.1em; display:flex; align-items:center; gap:7px; }
        .theme-quick{ width:34px; height:34px; border-radius:10px; border:1px solid var(--border); background:var(--card); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-mid); transition:background .2s ease; }
        .theme-quick:hover{ background:var(--row-hover); }

        main{ max-width:460px; margin:0 auto; padding:20px 18px 0; }

        /* ---------- summary strip ---------- */
        .summary-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
        .summary-card{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px 15px; box-shadow:var(--shadow); }
        .summary-card .lbl{ font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); margin:0 0 5px; display:flex; align-items:center; gap:5px; }
        .summary-card .val{ font-size:16px; font-weight:700; font-family:'JetBrains Mono',monospace; margin:0; }
        .summary-card.in .val{ color:var(--emerald); }
        .summary-card.out .val{ color:var(--rose); }

        /* ---------- filter chips ---------- */
        .filter-row{ display:flex; gap:9px; margin-bottom:20px; overflow-x:auto; padding-bottom:2px; }
        .filter-chip{
            flex-shrink:0; padding:9px 16px; border-radius:999px; border:1px solid var(--border); background:var(--card);
            font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--text-mid); cursor:pointer;
            transition:background .2s ease, color .2s ease, border-color .2s ease;
        }
        .filter-chip.active{ background:linear-gradient(135deg,var(--electric),#1d3fbf); border-color:transparent; color:#fff; }

        /* ---------- date groups + rows ---------- */
        .date-label{ font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.16em; color:var(--text-dim); margin:0 0 10px 4px; }
        .group{ background:var(--card); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow); margin-bottom:20px; overflow:hidden; }
        .tx-row{ display:flex; align-items:center; gap:12px; padding:14px 15px; cursor:pointer; transition:background .2s ease; border-bottom:1px solid var(--divider); }
        .group .tx-row:last-child{ border-bottom:none; }
        .tx-row:hover{ background:var(--row-hover); }
        .tx-icon{ width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .tx-icon.in{ background:rgba(52,211,153,.14); color:var(--emerald); }
        .tx-icon.out{ background:rgba(249,112,102,.14); color:var(--rose); }
        .tx-body{ flex:1; min-width:0; }
        .tx-type{ font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); margin:0; }
        .tx-detail{ font-size:12.5px; font-weight:700; margin:2px 0 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px; }
        .tx-time{ font-size:10px; color:var(--text-dim); margin:3px 0 0; font-weight:500; }
        .tx-amt{ text-align:right; flex-shrink:0; }
        .tx-amt .num{ font-size:13.5px; font-weight:800; font-family:'JetBrains Mono',monospace; }
        .tx-amt .num.in{ color:var(--emerald); }
        .tx-amt .num.out{ color:var(--rose); }
        .tx-amt .receipt-tag{ font-size:8.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--electric-soft); background:var(--row-hover); padding:2px 7px; border-radius:6px; margin-top:4px; display:inline-block; }

        /* ---------- states ---------- */
        .state-box{ background:var(--card); border:1px solid var(--border); border-radius:20px; padding:44px 20px; text-align:center; box-shadow:var(--shadow); }
        .state-box i{ width:26px; height:26px; color:var(--text-dim); margin-bottom:10px; }
        .state-box p{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); margin:0; }
        .spin-ring{ width:22px; height:22px; border:3px solid var(--border); border-top-color:var(--electric); border-radius:50%; margin:0 auto 12px; animation:spin 0.8s linear infinite; }
        @keyframes spin{ to{ transform:rotate(360deg); } }

        /* ---------- bottom nav ---------- */
        .bottom-nav-wrap{ position:fixed; bottom:0; left:0; right:0; z-index:45; padding:0 16px 16px; }
        .bottom-nav{ max-width:460px; margin:0 auto; background:var(--nav-bg); backdrop-filter:blur(16px); border:1px solid var(--border); border-radius:20px; height:64px; display:flex; align-items:center; justify-content:space-around; position:relative; box-shadow:0 -14px 34px -14px rgba(0,0,0,.25); }
        .bnav-item{ display:flex; flex-direction:column; align-items:center; justify-content:center; width:56px; color:var(--text-dim); gap:3px; }
        .bnav-item i{ width:16px; height:16px; }
        .bnav-item span{ font-size:8px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; }
        .bnav-center{ position:relative; top:-16px; }
        .bnav-center .glow{ position:absolute; inset:0; background:var(--electric); border-radius:14px; filter:blur(10px); opacity:.45; }
        .bnav-center a{ position:relative; width:50px; height:50px; border-radius:15px; background:linear-gradient(135deg,var(--electric),#1d3fbf); display:flex; align-items:center; justify-content:center; color:#fff; box-shadow:0 10px 24px rgba(59,107,255,.4); }

        /* ---------- receipt modal ---------- */
        .receipt-overlay{ position:fixed; inset:0; z-index:90; background:rgba(3,5,14,.62); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:16px; opacity:0; pointer-events:none; transition:opacity .28s ease; }
        .receipt-overlay.open{ opacity:1; pointer-events:auto; }
        .receipt-card{
            width:100%; max-width:380px; background:var(--card); border:1px solid var(--border); border-radius:26px; overflow:hidden;
            box-shadow:0 40px 100px -20px rgba(0,0,0,.5); transform:translateY(18px) scale(.96); transition:transform .32s cubic-bezier(.16,1,.3,1);
        }
        .receipt-overlay.open .receipt-card{ transform:translateY(0) scale(1); }
        .receipt-head{ padding:26px 24px 22px; text-align:center; border-bottom:1px solid var(--border); background:var(--card-2); }
        .receipt-mark{ width:52px; height:52px; border-radius:15px; background:linear-gradient(135deg,var(--electric),var(--cyan)); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; box-shadow:0 12px 26px rgba(59,107,255,.35); }
        .receipt-head h3{ font-size:16px; font-weight:700; margin:0; }
        .receipt-head .sub{ font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.2em; color:var(--text-dim); margin:4px 0 0; }
        .receipt-body{ padding:22px 24px; position:relative; }
        .receipt-stamp{
            position:absolute; top:30%; right:6%; width:96px; height:96px; border:2px dashed rgba(59,107,255,.3); border-radius:50%;
            display:flex; align-items:center; justify-content:center; transform:rotate(-16deg); pointer-events:none;
        }
        .receipt-stamp .inner{ border:1px solid rgba(59,107,255,.3); border-radius:50%; width:80px; height:80px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
        .receipt-stamp span{ display:block; font-size:6.5px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--electric-soft); line-height:1.5; }
        .r-row{ display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px dashed var(--divider); font-size:11.5px; }
        .r-row:last-of-type{ border-bottom:none; }
        .r-label{ font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); }
        .r-value{ font-weight:700; text-align:right; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .r-status{ background:rgba(52,211,153,.16); color:var(--emerald); padding:3px 10px; border-radius:999px; font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; }
        .r-amount{ font-size:19px; font-weight:800; color:var(--electric-soft); font-family:'JetBrains Mono',monospace; }
        .r-ref{ font-family:'JetBrains Mono',monospace; font-size:10px; background:var(--row-hover); padding:9px 11px; border-radius:10px; word-break:break-all; margin-top:6px; color:var(--text-mid); }
        .receipt-thanks{ text-align:center; padding-top:16px; margin-top:6px; border-top:1px solid var(--border); font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.14em; color:var(--text-dim); }
        .receipt-actions{ display:flex; gap:10px; padding:18px 24px 24px; background:var(--card-2); border-top:1px solid var(--border); }
        .r-btn{ flex:1; padding:13px; border-radius:12px; font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
        .r-btn.primary{ background:linear-gradient(135deg,var(--electric),#1d3fbf); color:#fff; }
        .r-btn.ghost{ background:var(--row-hover); color:var(--text-mid); }

        @media print {
            body *{ visibility:hidden; }
            #receipt-card, #receipt-card *{ visibility:visible; }
            #receipt-card{ position:absolute; left:0; top:0; width:100%; box-shadow:none; }
            .no-print{ display:none !important; }
        }
    </style>
</head>
<body>

    <nav class="topbar no-print">
        <a href="dashboard.html" class="back-btn"><i data-lucide="arrow-left"></i> Dashboard</a>
        <div class="topbar-title"><i data-lucide="history" style="width:14px;height:14px;color:var(--electric-soft);"></i> Transaction Log</div>
        <button class="theme-quick" onclick="toggleTheme()" aria-label="Toggle theme"><i data-lucide="sun-moon" id="themeIconTop" style="width:15px;height:15px;"></i></button>
    </nav>

    <main class="no-print">
        <div class="summary-row">
            <div class="summary-card in"><p class="lbl"><i data-lucide="arrow-down-left" style="width:11px;height:11px;"></i> Money in</p><p class="val" id="sumIn">&#8358;0</p></div>
            <div class="summary-card out"><p class="lbl"><i data-lucide="arrow-up-right" style="width:11px;height:11px;"></i> Money out</p><p class="val" id="sumOut">&#8358;0</p></div>
        </div>

        <div class="filter-row">
            <div class="filter-chip active" data-filter="all" onclick="setFilter('all', this)">All</div>
            <div class="filter-chip" data-filter="in" onclick="setFilter('in', this)">Money In</div>
            <div class="filter-chip" data-filter="out" onclick="setFilter('out', this)">Money Out</div>
        </div>

        <div id="history-container">
            <div class="state-box"><div class="spin-ring"></div><p>Retrieving transaction log&hellip;</p></div>
        </div>
    </main>

    <div id="receipt-modal" class="receipt-overlay no-print">
        <div id="receipt-card" class="receipt-card">
            <div class="receipt-head">
                <div class="receipt-mark"><i data-lucide="zap" style="width:24px;height:24px;color:#fff;"></i></div>
                <h3 class="font-display">BIGOTIC<span style="color:var(--text-dim);font-weight:400;">DATA</span></h3>
                <p class="sub">Official digital receipt</p>
            </div>
            <div id="receipt-details" class="receipt-body"></div>
            <div class="receipt-actions">
                <button onclick="window.print()" class="r-btn primary"><i data-lucide="download" style="width:13px;height:13px;"></i> Save / PDF</button>
                <button onclick="closeReceipt()" class="r-btn ghost">Close</button>
            </div>
        </div>
    </div>

    <div class="bottom-nav-wrap no-print">
        <div class="bottom-nav">
            <a href="buy-airtime.html" class="bnav-item"><i data-lucide="phone"></i><span>Airtime</span></a>
            <a href="buy-data.html" class="bnav-item"><i data-lucide="wifi"></i><span>Data</span></a>
            <div class="bnav-center"><div class="glow"></div><a href="dashboard.html"><i data-lucide="home" style="width:20px;height:20px;"></i></a></div>
            <a href="history.html" class="bnav-item" style="color:var(--electric-soft);"><i data-lucide="clock"></i><span>History</span></a>
            <a href="settings.html" class="bnav-item"><i data-lucide="settings"></i><span>Settings</span></a>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let allTransactions = [];
        let currentFilter = 'all';

        function applyThemeIcon(){
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            document.getElementById('themeIconTop')?.setAttribute('data-lucide', isLight ? 'sun' : 'moon');
            lucide.createIcons();
        }
        function toggleTheme(){
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('bigotic-theme', next);
            applyThemeIcon();
        }
        applyThemeIcon();

        function isCredit(tx){ return tx.type === "Wallet Funding" || tx.type === "Fund"; }

        function dateGroupLabel(dateStr){
            const d = new Date(dateStr);
            const today = new Date();
            const yest = new Date(); yest.setDate(today.getDate() - 1);
            const sameDay = (a,b) => a.toDateString() === b.toDateString();
            if (sameDay(d, today)) return 'Today';
            if (sameDay(d, yest)) return 'Yesterday';
            return d.toLocaleDateString('en-NG', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function setFilter(filter, el){
            currentFilter = filter;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            renderTransactions();
        }

        function renderTransactions(){
            const container = document.getElementById('history-container');
            let list = allTransactions;
            if (currentFilter === 'in') list = list.filter(isCredit);
            if (currentFilter === 'out') list = list.filter(tx => !isCredit(tx));

            if (!list.length){
                container.innerHTML = `<div class="state-box"><i data-lucide="inbox"></i><p>No transactions found</p></div>`;
                lucide.createIcons();
                return;
            }

            const groups = {};
            list.forEach(tx => {
                const label = dateGroupLabel(tx.date);
                if (!groups[label]) groups[label] = [];
                groups[label].push(tx);
            });

            let html = '';
            Object.keys(groups).forEach(label => {
                html += `<p class="date-label">${label}</p><div class="group">`;
                groups[label].forEach(tx => {
                    const credit = isCredit(tx);
                    const displayDetails = tx.details || `${tx.type} to ${tx.recipient || 'Account'}`;
                    html += `
                        <div class="tx-row" onclick="openReceipt('${tx.reference}')">
                            <div class="tx-icon ${credit ? 'in' : 'out'}"><i data-lucide="${credit ? 'arrow-down-left' : 'arrow-up-right'}" style="width:17px;height:17px;"></i></div>
                            <div class="tx-body">
                                <p class="tx-type">${tx.type || 'Transaction'}</p>
                                <p class="tx-detail">${displayDetails}</p>
                                <p class="tx-time">${new Date(tx.date).toLocaleTimeString('en-NG', { hour: '2-digit', minute: '2-digit' })}</p>
                            </div>
                            <div class="tx-amt">
                                <div class="num ${credit ? 'in' : 'out'}">${credit ? '+' : '-'}&#8358;${Number(tx.amount).toLocaleString('en-NG', { minimumFractionDigits: 2 })}</div>
                                <span class="receipt-tag">Receipt</span>
                            </div>
                        </div>`;
                });
                html += `</div>`;
            });

            container.innerHTML = html;
            lucide.createIcons();
        }

        function updateSummary(){
            let inTotal = 0, outTotal = 0;
            allTransactions.forEach(tx => {
                if (isCredit(tx)) inTotal += Number(tx.amount) || 0;
                else outTotal += Number(tx.amount) || 0;
            });
            document.getElementById('sumIn').innerText = '\u20a6' + inTotal.toLocaleString('en-NG', { maximumFractionDigits: 0 });
            document.getElementById('sumOut').innerText = '\u20a6' + outTotal.toLocaleString('en-NG', { maximumFractionDigits: 0 });
        }

        window.onload = async function() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) { window.location.href = 'login.html'; return; }

            let userEmail = (user.email || "").toLowerCase().trim();
            const container = document.getElementById('history-container');

            if (!userEmail) {
                container.innerHTML = `<div class="state-box"><i data-lucide="alert-circle" style="color:var(--rose);"></i><p style="color:var(--rose);">Session invalid &mdash; sign in again</p></div>`;
                lucide.createIcons();
                return;
            }

            try {
                const response = await fetch(`https://bigoticdata-backend.onrender.com/transactions/${encodeURIComponent(userEmail)}`);
                if (!response.ok) throw new Error("Fetch failed");

                allTransactions = await response.json();

                if (allTransactions && allTransactions.length > 0) {
                    updateSummary();
                    renderTransactions();
                } else {
                    container.innerHTML = `<div class="state-box"><i data-lucide="inbox"></i><p>No transactions found</p></div>`;
                    lucide.createIcons();
                }
            } catch (err) {
                console.error("LOG SYNC ERROR:", err);
                container.innerHTML = `<div class="state-box"><i data-lucide="wifi-off" style="color:var(--rose);"></i><p style="color:var(--rose);">Connection error &mdash; please refresh</p></div>`;
                lucide.createIcons();
            }
        };

        function openReceipt(ref) {
            const tx = allTransactions.find(t => t.reference === ref);
            if (!tx) return;

            const details = document.getElementById('receipt-details');
            details.innerHTML = `
                <div class="receipt-stamp"><div class="inner"><span>Approved</span><span>&#10022; Official &#10022;</span><span>bigoticdata.com.ng</span></div></div>
                <div class="r-row"><span class="r-label">Status</span><span class="r-status">Successful</span></div>
                <div class="r-row"><span class="r-label">Type</span><span class="r-value">${tx.type}</span></div>
                <div class="r-row"><span class="r-label">Beneficiary</span><span class="r-value">${tx.recipient || 'N/A'}</span></div>
                <div class="r-row"><span class="r-label">Amount</span><span class="r-amount">&#8358;${Number(tx.amount).toLocaleString('en-NG', { minimumFractionDigits: 2 })}</span></div>
                <div style="margin-top:10px;"><span class="r-label">Reference</span><p class="r-ref">${tx.reference}</p></div>
                <div class="r-row" style="margin-top:6px;"><span class="r-label">Timestamp</span><span class="r-value">${new Date(tx.date).toLocaleString()}</span></div>
                <p class="receipt-thanks">Thank you for choosing Bigotic Data</p>
            `;

            document.getElementById('receipt-modal').classList.add('open');
            lucide.createIcons();
        }

        function closeReceipt() {
            document.getElementById('receipt-modal').classList.remove('open');
        }
    </script>
</body>
</html>
