<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bigotic Data | Send Bulk SMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        (function(){
            const saved = localStorage.getItem('bigotic-theme');
            document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
        })();
    </script>

    <style>
        :root{ --electric:#3b6bff; --electric-soft:#7c9bff; --cyan:#28e0d6; --emerald:#34d399; --rose:#f97066; --gold:#f4b740; }
        html[data-theme="dark"]{
            --bg:#060915; --bg-elevated:#0d1330; --card:#0f1638; --card-2:linear-gradient(165deg,#121a42,#0d1330);
            --border: rgba(148,163,255,0.14); --text-hi:#eef1ff; --text-mid:#aab0d6; --text-dim:#6b71a0;
            --nav-bg: rgba(6,9,21,0.78); --shadow: 0 20px 45px -14px rgba(0,0,0,.5);
            --row-hover: rgba(124,155,255,.07); --input-bg: rgba(255,255,255,.04);
        }
        html[data-theme="light"]{
            --bg:#f2f4fb; --bg-elevated:#ffffff; --card:#ffffff; --card-2:linear-gradient(165deg,#ffffff,#f6f8ff);
            --border:#e6e9f6; --text-hi:#0f1428; --text-mid:#5b6178; --text-dim:#98a0c2;
            --nav-bg: rgba(255,255,255,.85); --shadow: 0 20px 45px -20px rgba(30,58,138,.14);
            --row-hover: rgba(59,107,255,.05); --input-bg: #f5f7fd;
        }
        *{ box-sizing:border-box; }
        html, body{ margin:0; padding:0; }
        body{
            font-family:'Inter',sans-serif; background:var(--bg); color:var(--text-hi); min-height:100vh;
            overflow-x:hidden; padding-bottom:60px; transition: background .35s ease, color .35s ease;
        }
        .font-display{ font-family:'Space Grotesk',sans-serif; }
        .font-mono{ font-family:'JetBrains Mono',monospace; }
        a{ text-decoration:none; color:inherit; }
        button{ font-family:inherit; }
        @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

        .topbar{ position:sticky; top:0; z-index:40; height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 18px; background:var(--nav-bg); backdrop-filter:blur(14px); border-bottom:1px solid var(--border); }
        .back-btn{ display:flex; align-items:center; gap:7px; color:var(--text-mid); font-size:12px; font-weight:700; }
        .back-btn i{ width:16px; height:16px; }
        .topbar-title{ font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.1em; display:flex; align-items:center; gap:7px; }
        .theme-quick{ width:34px; height:34px; border-radius:10px; border:1px solid var(--border); background:var(--card); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-mid); }

        main{ max-width:460px; margin:0 auto; padding:22px 18px 0; }
        .card{ background:var(--card); border:1px solid var(--border); border-radius:24px; box-shadow:var(--shadow); padding:24px 22px; }
        .card h2{ font-size:17px; font-weight:700; text-align:center; margin:0 0 22px; }

        .field-label{ font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--electric-soft); margin:0 0 9px; display:block; }
        .field{ margin-bottom:18px; }

        .input-wrap input, textarea{
            width:100%; background:var(--input-bg); border:1px solid var(--border); border-radius:13px; padding:13px 15px;
            font-size:13px; font-weight:600; color:var(--text-hi); outline:none; transition:border-color .2s ease; font-family:'Inter',sans-serif; resize:none;
        }
        .input-wrap input{ text-transform:uppercase; font-weight:800; letter-spacing:.03em; }
        .input-wrap input:focus, textarea:focus{ border-color:var(--electric-soft); }

        .meta-row{ display:flex; justify-content:flex-end; margin-top:7px; }
        .meta-chip{ font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; background:var(--row-hover); color:var(--electric-soft); padding:4px 10px; border-radius:999px; border:1px solid var(--border); }
        .meta-row.split{ justify-content:space-between; }
        .meta-chip.dim{ color:var(--text-dim); background:none; border:none; padding:4px 0; }

        .pin-dots{ display:flex; gap:12px; justify-content:center; margin:4px 0 4px; }
        .pin-dots span{ width:14px; height:14px; border-radius:50%; background:var(--border); transition:background .2s ease, transform .2s ease; }
        .pin-dots span.filled{ background:var(--electric); transform:scale(1.15); }
        #transactionPin{ position:absolute; opacity:0; pointer-events:none; }

        .price-box{
            background:linear-gradient(135deg,var(--electric),#1d3fbf 70%,var(--cyan)); border-radius:16px; padding:16px; text-align:center; margin-bottom:20px; color:#fff;
        }
        .price-box .lbl{ font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.1em; color:rgba(255,255,255,.75); margin:0; }
        .price-box .val{ font-size:24px; font-weight:700; font-family:'JetBrains Mono',monospace; margin:3px 0 0; }
        .price-box .rate{ font-size:9px; color:rgba(255,255,255,.65); margin-top:5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }

        .submit-btn{
            width:100%; border:none; cursor:pointer; background:linear-gradient(135deg,var(--electric),#1d3fbf); color:#fff;
            padding:16px; border-radius:15px; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.06em;
            display:flex; align-items:center; justify-content:center; gap:9px; box-shadow:0 16px 34px -10px rgba(59,107,255,.45);
            transition:transform .2s ease, opacity .2s ease;
        }
        .submit-btn:hover:not(:disabled){ transform:translateY(-2px); }
        .submit-btn:disabled{ opacity:.7; cursor:progress; }
        .spinner{ width:15px; height:15px; border-radius:50%; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; animation:spin .7s linear infinite; }
        @keyframes spin{ to{ transform:rotate(360deg); } }

        .result-icon{ width:60px; height:60px; border-radius:50%; margin:0 auto 16px; display:flex; align-items:center; justify-content:center; position:relative; }
        .result-icon::before{ content:''; position:absolute; inset:-8px; border-radius:50%; opacity:.5; animation:pulse-ring 1.8s ease-out infinite; }
        @keyframes pulse-ring{ 0%{ opacity:.5; transform:scale(1);} 100%{ opacity:0; transform:scale(1.4);} }
        .modal-overlay{ position:fixed; inset:0; z-index:90; background:rgba(3,5,14,.62); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; pointer-events:none; transition:opacity .28s ease; }
        .modal-overlay.open{ opacity:1; pointer-events:auto; }
        .modal-card{ width:100%; max-width:330px; background:var(--card-2); border:1px solid var(--border); border-radius:24px; padding:28px; text-align:center; box-shadow:0 40px 100px -20px rgba(0,0,0,.5); transform:translateY(18px) scale(.96); transition:transform .32s cubic-bezier(.16,1,.3,1); }
        .modal-overlay.open .modal-card{ transform:translateY(0) scale(1); }
        .modal-card h3{ font-size:16px; font-weight:700; margin:0 0 6px; }
        .modal-card p{ font-size:11.5px; color:var(--text-mid); line-height:1.6; margin:0 0 18px; }
        .result-btn{ width:100%; border:none; cursor:pointer; padding:13px; border-radius:12px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:#fff; background:linear-gradient(135deg,var(--emerald),#1fae7d); }

        #toastContainer{ position:fixed; top:18px; right:18px; z-index:99; display:flex; flex-direction:column; gap:11px; max-width:340px; width:calc(100% - 36px); pointer-events:none; }
        .toast{ pointer-events:auto; position:relative; overflow:hidden; display:flex; align-items:flex-start; gap:11px; padding:15px 16px 14px; border-radius:16px; background:var(--card-2); border:1px solid var(--border); box-shadow:0 24px 55px -16px rgba(0,0,0,.35); transform:translateY(-14px) scale(.96); opacity:0; transition:transform .38s cubic-bezier(.16,1,.3,1), opacity .3s ease; }
        .toast.show{ transform:translateY(0) scale(1); opacity:1; }
        .toast::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:linear-gradient(180deg,var(--rose),#c8362a); }
        .toast::after{ content:''; position:absolute; left:0; bottom:0; height:2px; width:100%; background:linear-gradient(90deg,var(--rose),transparent); transform-origin:left; animation: toast-countdown 3.6s linear forwards; }
        .toast:hover::after{ animation-play-state:paused; }
        @keyframes toast-countdown{ from{ transform:scaleX(1); } to{ transform:scaleX(0); } }
        .toast .icon{ width:31px; height:31px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:rgba(249,112,102,.16); color:var(--rose); }
        .toast .title{ margin:0 0 2px; font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; }
        .toast p.msg{ margin:0; font-size:11.5px; font-weight:500; color:var(--text-mid); line-height:1.5; }
        .toast .dismiss{ background:none; border:none; color:var(--text-dim); cursor:pointer; padding:3px; border-radius:6px; flex-shrink:0; }
    </style>
</head>
<body>

    <nav class="topbar">
        <a href="dashboard.html" class="back-btn"><i data-lucide="arrow-left"></i> Dashboard</a>
        <div class="topbar-title"><i data-lucide="message-square" style="width:14px;height:14px;color:var(--electric-soft);"></i> Bulk SMS</div>
        <button class="theme-quick" onclick="toggleTheme()" aria-label="Toggle theme"><i data-lucide="sun-moon" id="themeIconTop" style="width:15px;height:15px;"></i></button>
    </nav>

    <div id="toastContainer"></div>

    <main>
        <div class="card">
            <h2 class="font-display">Send bulk SMS gateway</h2>

            <div class="field">
                <label class="field-label" for="senderName">Sender ID (max 11 characters)</label>
                <div class="input-wrap"><input type="text" id="senderName" placeholder="e.g. BIGOTIC" maxlength="11"></div>
            </div>

            <div class="field">
                <label class="field-label" for="recipientNumbers">Recipient phone numbers</label>
                <textarea id="recipientNumbers" rows="4" placeholder="Type or paste multiple phone numbers here (separate with commas or line breaks)&hellip;" oninput="runSmsAnalysis()"></textarea>
                <div class="meta-row"><span class="meta-chip" id="label-recipients">Recipients: 0</span></div>
            </div>

            <div class="field">
                <label class="field-label" for="smsMessage">Message text box</label>
                <textarea id="smsMessage" rows="5" placeholder="Compose your message content here&hellip;" oninput="runSmsAnalysis()"></textarea>
                <div class="meta-row split">
                    <span class="meta-chip dim" id="label-chars">Characters: 0</span>
                    <span class="meta-chip" id="label-pages">Pages: 1 (160 char/pg)</span>
                </div>
            </div>

            <div class="field">
                <label class="field-label" style="text-align:center;">4-digit authorization security PIN</label>
                <div class="pin-dots" id="pinDots"><span></span><span></span><span></span><span></span></div>
                <input type="password" id="transactionPin" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" autocomplete="off">
            </div>

            <div class="price-box">
                <p class="lbl">Estimated invoiced cost</p>
                <h3 class="val">&#8358;<span id="total-price-ledger">0.00</span></h3>
                <p class="rate">&#8358;5.00 per recipient, per page</p>
            </div>

            <button id="sendBtn" onclick="transmitSmsPayload()" class="submit-btn"><span id="sendBtnLabel">Dispatch transmission</span></button>
        </div>
    </main>

    <div id="successResponseModal" class="modal-overlay">
        <div class="modal-card">
            <div class="result-icon" style="background:rgba(52,211,153,.16);"><i data-lucide="check-circle-2" style="width:26px;height:26px;color:var(--emerald);"></i></div>
            <h3 class="font-display">Transmission dispatched!</h3>
            <p id="successModalMsg">Your bulk SMS packets have been sent successfully.</p>
            <button onclick="closeSuccessModal()" class="result-btn">Acknowledge</button>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const retailRate = 5.00;
        const pinInput = document.getElementById('transactionPin');
        const successResponseModal = document.getElementById('successResponseModal');

        function applyThemeIcon(){
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            document.getElementById('themeIconTop')?.setAttribute('data-lucide', isLight ? 'sun' : 'moon');
            lucide.createIcons();
        }
        function toggleTheme(){
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('bigotic-theme', next);
            applyThemeIcon();
        }
        applyThemeIcon();

        function showNotification(message, type = 'error') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            const iconName = type === 'success' ? 'check-circle-2' : 'alert-circle';
            toast.innerHTML = `
                <span class="icon"><i data-lucide="${iconName}" style="width:15px;height:15px;"></i></span>
                <div style="flex:1;"><p class="title">${type === 'success' ? 'Success' : 'Something needs attention'}</p><p class="msg">${message}</p></div>
                <button class="dismiss" aria-label="Dismiss"><i data-lucide="x" style="width:13px;height:13px;"></i></button>
            `;
            container.appendChild(toast);
            lucide.createIcons();
            requestAnimationFrame(() => toast.classList.add('show'));
            let dismissed = false;
            const remove = () => { if (dismissed) return; dismissed = true; toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); };
            toast.querySelector('.dismiss').addEventListener('click', remove);
            let timer = setTimeout(remove, 3600);
            toast.addEventListener('mouseenter', () => clearTimeout(timer));
            toast.addEventListener('mouseleave', () => { timer = setTimeout(remove, 1200); });
        }

        function updatePinDots(){
            const val = pinInput.value || '';
            document.querySelectorAll('#pinDots span').forEach((dot, i) => dot.classList.toggle('filled', i < val.length));
        }
        pinInput.addEventListener('input', updatePinDots);
        document.getElementById('pinDots').addEventListener('click', () => pinInput.focus());

        function closeSuccessModal(){ successResponseModal.classList.remove('open'); }

        function fetchRecipientTokens() {
            const numbersContent = document.getElementById('recipientNumbers').value;
            return numbersContent.split(/[\s,]+/).filter(token => token.trim().length >= 10);
        }

        function runSmsAnalysis() {
            const textContent = document.getElementById('smsMessage').value;
            const charactersCount = textContent.length;
            const cleanRecipients = fetchRecipientTokens();
            const counterRecipients = cleanRecipients.length;

            const pageBlocks = charactersCount === 0 ? 1 : Math.ceil(charactersCount / 160);
            const absoluteCostPrice = counterRecipients * pageBlocks * retailRate;

            document.getElementById('label-recipients').innerText = `Recipients: ${counterRecipients}`;
            document.getElementById('label-chars').innerText = `Characters: ${charactersCount}`;
            document.getElementById('label-pages').innerText = `Pages: ${pageBlocks} (160 char/pg)`;
            document.getElementById('total-price-ledger').innerText = absoluteCostPrice.toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        async function transmitSmsPayload() {
            const user = JSON.parse(localStorage.getItem('user'));
            const userEmail = user ? user.email : null;

            const senderId = document.getElementById('senderName').value.trim();
            const recipientsList = fetchRecipientTokens();
            const bodyMessage = document.getElementById('smsMessage').value.trim();
            const securityPin = pinInput.value;
            const executionBtn = document.getElementById('sendBtn');
            const executionBtnLabel = document.getElementById('sendBtnLabel');

            if (!userEmail) {
                showNotification("Session expired. Please log in again.");
                setTimeout(() => { window.location.href = 'login.html'; }, 1600);
                return;
            }
            if (!senderId || recipientsList.length === 0 || !bodyMessage) {
                showNotification("Please fill in the sender ID, recipients, and message.");
                return;
            }
            if (!securityPin || securityPin.length !== 4) {
                showNotification("Please enter your 4-digit security PIN.");
                return;
            }

            executionBtn.disabled = true;
            executionBtnLabel.innerHTML = '<span class="spinner"></span> Dispatching&hellip;';

            try {
                const response = await fetch('https://bigoticdata-backend.onrender.com/send-bulksms', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: userEmail,
                        senderName: senderId,
                        recipientNumber: recipientsList.join(','),
                        message: bodyMessage,
                        pin: securityPin
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    document.getElementById('successModalMsg').innerText = `Your message reached ${recipientsList.length} recipient${recipientsList.length > 1 ? 's' : ''} successfully.`;
                    successResponseModal.classList.add('open');
                    document.getElementById('smsMessage').value = "";
                    document.getElementById('recipientNumbers').value = "";
                    pinInput.value = "";
                    updatePinDots();
                    runSmsAnalysis();
                } else {
                    showNotification(data.error || "The carrier gateway rejected this request.");
                }
            } catch (err) {
                showNotification("Network communication timed out. Please retry.");
            } finally {
                executionBtn.disabled = false;
                executionBtnLabel.innerText = "Dispatch transmission";
            }
        }

        window.onload = function(){
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) { window.location.href = 'login.html'; }
        };
    </script>
</body>
</html>
