<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2857e8">
<meta name="referrer" content="no-referrer">
<title>Reset Password | Bigotic Data</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7ff;font-family:Arial,sans-serif;color:#142344;padding:20px}
.card{width:100%;max-width:440px;background:white;border:1px solid #e3e9f7;border-radius:24px;padding:36px 30px;box-shadow:0 20px 60px #153f9614}
.logo{display:block;width:140px;max-width:100%;height:auto;margin:0 auto 26px}
h1{font-size:27px;margin:0 0 12px;text-align:center}
p{color:#64718a;line-height:1.7;font-size:14px;text-align:center}
label{display:block;font-size:13px;font-weight:700;margin:20px 0 9px}
input{width:100%;padding:15px;border:1px solid #d8e1f1;border-radius:11px;font-size:15px;outline:none}
input:focus{border-color:#2857e8;box-shadow:0 0 0 3px #2857e81a}
button{width:100%;margin-top:22px;padding:16px;border:0;border-radius:11px;background:#2857e8;color:white;font-size:14px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.message{display:none;margin-top:17px;padding:14px;border-radius:10px;font-size:13px;line-height:1.6}
.message.show{display:block;background:#edf5ff;color:#18439a}
.message.error{background:#fff0f1;color:#b32940}
.back{display:block;margin-top:25px;text-align:center;color:#2857e8;text-decoration:none;font-size:13px;font-weight:700}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="/Bigoticdata.com.ng.png" alt="Bigotic Data">
<h1>Create a new password</h1>
<p>Choose a secure password containing at least 8 characters.</p>
<form id="resetForm">
<label for="password">New password</label>
<input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
<label for="confirm">Confirm new password</label>
<input id="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
<button id="submitBtn" type="submit">Reset Password</button>
</form>
<div id="message" class="message" role="status" aria-live="polite"></div>
<a class="back" href="login.html">Back to Login</a>
</main>
<script>
'use strict';
const API = 'https://bigoticdata-backend.onrender.com';
const params = new URLSearchParams(location.search);
const token = params.get('token') || '';
history.replaceState(null, '', location.pathname);

const form = document.getElementById('resetForm');
const button = document.getElementById('submitBtn');
const message = document.getElementById('message');

function show(text, error = false) {
  message.textContent = text;
  message.className = 'message show' + (error ? ' error' : '');
}

if (!/^[a-f0-9]{64}$/.test(token)) {
  form.hidden = true;
  show('This reset link is invalid. Please request a new one.', true);
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();

  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;

  if (password !== confirm) {
    show('Your passwords do not match.', true);
    return;
  }

  button.disabled = true;
  button.textContent = 'Updating...';

  try {
    const response = await fetch(API + '/reset-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ token, password })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        response.status === 429
          ? 'Too many requests. Please try again later.'
          : (data.error || 'Reset failed. Please request a new link.')
      );
    }

    form.hidden = true;
    show('Your password has been changed successfully. You can now sign in.');
  } catch (error) {
    show(error.message || 'Connection failed. Please try again.', true);
  } finally {
    button.disabled = false;
    button.textContent = 'Reset Password';
  }
});
</script>
</body>
</html>
