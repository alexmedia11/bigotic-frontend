<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Bigotic Data Secure Automation Dashboard</title>
    <meta name="title" content="Login | Bigotic Data Secure Automation Dashboard">
    <meta name="description" content="Securely log in to your Bigotic Data user dashboard channel panel. Buy cheap internet bundles, load wholesale airtime VTU, and generate automated utility bills seamlessly.">
    <meta name="robots" content="index, follow">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bigoticdata.com.ng/login.html">
    <meta property="og:title" content="Login to Bigotic Data Platform">
    <meta property="og:description" content="Access your personalized distribution account panel to finalize data bundle recharges and token settlements instantly.">
    <meta property="og:image" content="https://bigoticdata.com.ng/Promo1.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root{
            --ink:#060915;
            --ink-soft:#0d1330;
            --panel:#0f1638;
            --panel-line: rgba(148,163,255,0.14);
            --text-hi:#eef1ff;
            --text-mid:#aab0d6;
            --text-dim:#6b71a0;
            --electric:#3b6bff;
            --electric-soft:#7c9bff;
            --cyan:#28e0d6;
            --emerald:#34d399;
            --rose:#f97066;
        }
        *{ box-sizing:border-box; }
        body{
            margin:0; min-height:100vh; font-family:'Inter',sans-serif; color:var(--text-hi);
            background:radial-gradient(circle at 82% 92%, #142055 0%, var(--ink) 55%);
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            padding:28px; position:relative; overflow-x:hidden;
        }
        .font-display{ font-family:'Space Grotesk',sans-serif; }
        .font-mono{ font-family:'JetBrains Mono',monospace; }

        /* ambient living background */
        .blob{ position:fixed; border-radius:50%; filter:blur(90px); pointer-events:none; z-index:0; opacity:.5; }
        .blob-1{ width:420px; height:420px; background:radial-gradient(circle, rgba(40,224,214,.4), transparent 70%); top:-140px; right:-120px; animation: drift1 17s ease-in-out infinite; }
        .blob-2{ width:380px; height:380px; background:radial-gradient(circle, rgba(59,107,255,.45), transparent 70%); bottom:-150px; left:-110px; animation: drift2 20s ease-in-out infinite; }
        @keyframes drift1{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(-35px,30px); } }
        @keyframes drift2{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(30px,-35px); } }

        .particles{ position:fixed; inset:0; z-index:0; pointer-events:none; }
        .particle{ position:absolute; width:3px; height:3px; border-radius:50%; background:var(--cyan); opacity:.5; animation: rise linear infinite; }
        @keyframes rise{ from{ transform:translateY(0); opacity:0; } 10%{ opacity:.6; } 90%{ opacity:.4; } to{ transform:translateY(-100vh); opacity:0; } }

        /* orbiting security ring behind the card, on brand with the "secure dashboard" framing */
        .orbit-ring{
            position:fixed; top:50%; left:50%; width:640px; height:640px; margin:-320px 0 0 -320px;
            border:1px solid rgba(124,155,255,.08); border-radius:50%; z-index:0; pointer-events:none;
            animation: spin-slow 60s linear infinite;
        }
        .orbit-ring::before{
            content:''; position:absolute; top:-3px; left:50%; width:6px; height:6px; margin-left:-3px;
            border-radius:50%; background:var(--cyan); box-shadow:0 0 12px 3px rgba(40,224,214,.7);
        }
        .orbit-ring-2{ width:820px; height:820px; margin:-410px 0 0 -410px; animation-duration:90s; animation-direction:reverse; opacity:.6; }
        @keyframes spin-slow{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }

        @media (prefers-reduced-motion: reduce){ *{ animation:none !important; } }

        .wrap{ position:relative; z-index:2; max-width:410px; width:100%; }

        .brand-logo{ display:flex; align-items:center; justify-content:center; gap:9px; margin-bottom:26px; text-decoration:none; }
        .brand-logo .mark{
            width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,var(--electric),var(--cyan));
            display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(59,107,255,.35);
        }
        .brand-logo .word{ font-size:19px; font-weight:700; color:var(--text-hi); letter-spacing:-.02em; }
        .brand-logo .word span{ color:var(--text-dim); font-weight:400; }

        .card{
            background:linear-gradient(165deg, var(--panel), var(--ink-soft));
            border:1px solid var(--panel-line); border-radius:26px; padding:38px 32px;
            box-shadow:0 40px 100px -20px rgba(0,0,0,.55), 0 0 0 1px rgba(124,155,255,.05);
            position:relative; overflow:hidden;
        }
        .card::before{
            content:''; position:absolute; top:-70%; right:-15%; width:130%; height:130%;
            background:radial-gradient(circle, rgba(40,224,214,.13), transparent 60%); pointer-events:none;
        }
        .card > *{ position:relative; z-index:1; }

        .badge-row{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
        .lock-badge{
            width:34px; height:34px; border-radius:11px; background:rgba(59,107,255,.14); border:1px solid rgba(124,155,255,.3);
            display:flex; align-items:center; justify-content:center; color:var(--electric-soft);
        }
        .card h2{ font-size:21px; font-weight:700; margin:0 0 4px; }
        .card .sub{ color:var(--text-mid); font-size:12.5px; margin:0 0 26px; line-height:1.6; }

        .field{ margin-bottom:18px; }
        .field-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
        .field label{
            font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.09em; color:var(--text-dim);
        }
        .field .forgot{ font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--electric-soft); text-decoration:none; }
        .field .forgot:hover{ text-decoration:underline; }

        .input-wrap{ position:relative; }
        .input-wrap i{ position:absolute; left:14px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--text-dim); }
        .input-wrap input{
            width:100%; background:rgba(255,255,255,.03); border:1px solid var(--panel-line); border-radius:12px;
            padding:13px 14px 13px 40px; color:var(--text-hi); font-size:13px; font-family:'Inter',sans-serif;
            transition:border-color .2s ease, background .2s ease; outline:none;
        }
        .input-wrap input::placeholder{ color:var(--text-dim); }
        .input-wrap input:focus{ border-color:var(--electric-soft); background:rgba(255,255,255,.05); }
        .input-wrap input.err{ border-color:var(--rose); }
        .input-wrap .toggle-pass{
            position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer;
            color:var(--text-dim); padding:4px; display:flex; transition:color .2s ease;
        }
        .input-wrap .toggle-pass:hover{ color:var(--text-hi); }
        .field-error{ color:var(--rose); font-size:11px; margin-top:6px; min-height:14px; }

        .submit-btn{
            width:100%; border:none; cursor:pointer; margin-top:6px;
            background:linear-gradient(135deg, var(--electric), #1d3fbf); color:#fff;
            padding:15px; border-radius:13px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
            display:flex; align-items:center; justify-content:center; gap:9px;
            box-shadow:0 14px 30px rgba(59,107,255,.35);
            transition:transform .2s ease, box-shadow .2s ease, opacity .2s ease;
        }
        .submit-btn:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 18px 36px rgba(59,107,255,.45); }
        .submit-btn:active:not(:disabled){ transform:translateY(0) scale(.98); }
        .submit-btn:disabled{ opacity:.75; cursor:progress; }

        .spinner{
            width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.35); border-top-color:#fff;
            animation:spin .7s linear infinite;
        }
        @keyframes spin{ to{ transform:rotate(360deg); } }

        .switch-line{ text-align:center; font-size:12px; color:var(--text-mid); margin-top:22px; }
        .switch-line a{ color:var(--electric-soft); font-weight:700; text-decoration:none; }
        .switch-line a:hover{ text-decoration:underline; }

        .trust-row{ display:flex; align-items:center; justify-content:center; gap:6px; margin-top:22px; color:var(--text-dim); font-size:10.5px; }
        .trust-row i{ width:12px; height:12px; }

        /* toasts — extreme premium treatment */
        #toastContainer{ position:fixed; top:22px; right:22px; z-index:60; display:flex; flex-direction:column; gap:12px; max-width:360px; width:calc(100% - 44px); pointer-events:none; }
        .toast{
            pointer-events:auto; position:relative; overflow:hidden;
            display:flex; align-items:flex-start; gap:12px; padding:16px 18px 15px;
            border-radius:16px; background:linear-gradient(165deg, var(--panel), var(--ink-soft));
            border:1px solid var(--panel-line);
            box-shadow:0 24px 60px -14px rgba(0,0,0,.6), 0 0 0 1px rgba(124,155,255,.04);
            transform:translateY(-16px) scale(.96); opacity:0;
            transition:transform .4s cubic-bezier(.16,1,.3,1), opacity .35s ease, box-shadow .3s ease;
        }
        .toast.show{ transform:translateY(0) scale(1); opacity:1; }
        .toast::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:3px; }
        .toast.success::before{ background:linear-gradient(180deg,var(--emerald),#1fae7d); box-shadow:0 0 14px rgba(52,211,153,.6); }
        .toast.error::before{ background:linear-gradient(180deg,var(--rose),#c8362a); box-shadow:0 0 14px rgba(249,112,102,.55); }
        .toast::after{
            content:''; position:absolute; left:0; bottom:0; height:2px; width:100%;
            transform-origin:left; animation: toast-countdown 4.2s linear forwards;
        }
        .toast:hover::after{ animation-play-state:paused; }
        .toast.success::after{ background:linear-gradient(90deg,var(--emerald),transparent); }
        .toast.error::after{ background:linear-gradient(90deg,var(--rose),transparent); }
        @keyframes toast-countdown{ from{ transform:scaleX(1); } to{ transform:scaleX(0); } }
        .toast .icon{ width:32px; height:32px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; position:relative; }
        .toast .icon::before{ content:''; position:absolute; inset:-4px; border-radius:12px; opacity:.5; animation: icon-pulse 1.8s ease-out infinite; }
        .toast.success .icon{ background:rgba(52,211,153,.16); color:var(--emerald); }
        .toast.success .icon::before{ box-shadow:0 0 0 1px rgba(52,211,153,.5); }
        .toast.error .icon{ background:rgba(249,112,102,.16); color:var(--rose); }
        .toast.error .icon::before{ box-shadow:0 0 0 1px rgba(249,112,102,.5); }
        @keyframes icon-pulse{ 0%{ opacity:.5; transform:scale(1); } 100%{ opacity:0; transform:scale(1.35); } }
        .toast .body{ flex:1; padding-top:1px; }
        .toast .title{ margin:0 0 2px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; }
        .toast.success .title{ color:var(--emerald); }
        .toast.error .title{ color:var(--rose); }
        .toast p{ margin:0; font-size:12px; font-weight:500; color:var(--text-mid); line-height:1.55; }
        .toast .dismiss{
            background:none; border:none; color:var(--text-dim); cursor:pointer; padding:3px; border-radius:6px;
            flex-shrink:0; margin-top:1px; transition:color .2s ease, background .2s ease;
        }
        .toast .dismiss:hover{ color:var(--text-hi); background:rgba(255,255,255,.06); }

        /* extreme-premium success celebration toast variant used only on login success */
        .toast.celebrate{ border-color:rgba(52,211,153,.35); box-shadow:0 24px 70px -12px rgba(52,211,153,.35), 0 0 0 1px rgba(52,211,153,.08); }
        .toast.celebrate .icon{ background:rgba(52,211,153,.2); }

        /* full-screen brand loader */
        #brand-loader-overlay{
            position:fixed; inset:0; z-index:9999; background:var(--ink);
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            opacity:0; pointer-events:none; transition:opacity .5s ease;
        }
        #brand-loader-overlay.on{ opacity:1; pointer-events:auto; }
        .loader-mark{
            width:64px; height:64px; border-radius:18px; background:linear-gradient(135deg,var(--electric),var(--cyan));
            display:flex; align-items:center; justify-content:center; margin-bottom:22px;
            box-shadow:0 20px 50px rgba(59,107,255,.4); animation: logo-bounce 2s ease-in-out infinite;
        }
        @keyframes logo-bounce{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-8px); } }
        .wave-bars{ display:flex; align-items:flex-end; gap:5px; height:26px; margin-bottom:16px; }
        .wave-bars span{ width:5px; border-radius:3px; background:linear-gradient(180deg,var(--cyan),var(--electric)); animation:wave-grow .8s ease-in-out infinite; }
        @keyframes wave-grow{ 0%,100%{ height:5px; } 50%{ height:24px; } }
        #loader-status-text{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.22em; color:var(--text-dim); }
        .loader-check{
            width:64px; height:64px; border-radius:50%; background:rgba(52,211,153,.14); border:1px solid rgba(52,211,153,.4);
            display:flex; align-items:center; justify-content:center; margin-bottom:22px; color:var(--emerald);
            box-shadow:0 0 40px rgba(52,211,153,.35);
        }
    </style>
</head>
<body>

    <div class="orbit-ring"></div>
    <div class="orbit-ring orbit-ring-2"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="particles" id="particles"></div>

    <div id="brand-loader-overlay">
        <div class="loader-mark" id="loaderMark"><i data-lucide="zap" style="width:28px;height:28px;color:#fff;"></i></div>
        <div class="wave-bars">
            <span style="animation-delay:.0s;"></span>
            <span style="animation-delay:.1s;"></span>
            <span style="animation-delay:.2s;"></span>
            <span style="animation-delay:.3s;"></span>
            <span style="animation-delay:.4s;"></span>
        </div>
        <p id="loader-status-text">Verifying credentials&hellip;</p>
    </div>

    <div id="toastContainer"></div>

    <div class="wrap">
        <a href="index.html" class="brand-logo">
            <span class="mark"><i data-lucide="zap" style="width:18px;height:18px;color:#fff;"></i></span>
            <span class="font-display word">BIGOTIC<span>DATA</span></span>
        </a>

        <div class="card">
            <div class="badge-row">
                <div class="lock-badge"><i data-lucide="shield-check" style="width:17px;height:17px;"></i></div>
            </div>
            <h2 class="font-display">Welcome back</h2>
            <p class="sub">Access your secure automated distribution dashboard panel.</p>

            <form id="loginForm" novalidate>
                <div class="field">
                    <div class="field-head"><label for="email">Email address</label></div>
                    <div class="input-wrap">
                        <i data-lucide="mail"></i>
                        <input type="email" id="email" required placeholder="name@gmail.com">
                    </div>
                    <div class="field-error" data-error-for="email"></div>
                </div>

                <div class="field">
                    <div class="field-head">
                        <label for="password">Account password</label>
                        <a href="#" class="forgot">Forgot?</a>
                    </div>
                    <div class="input-wrap">
                        <i data-lucide="lock"></i>
                        <input type="password" id="password" required minlength="6" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
                        <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password"><i data-lucide="eye" style="width:15px;height:15px;"></i></button>
                    </div>
                    <div class="field-error" data-error-for="password"></div>
                </div>

                <button type="submit" id="loginBtn" class="submit-btn">
                    <span id="loginBtnLabel">Login to dashboard</span>
                </button>
            </form>

            <p class="switch-line">New to Bigotic Data? <a href="signup.html">Sign up free</a></p>
            <div class="trust-row"><i data-lucide="shield-check"></i> 256-bit encrypted authentication</div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        (function initParticles(){
            const wrap = document.getElementById('particles');
            const count = window.innerWidth < 640 ? 14 : 26;
            for (let i = 0; i < count; i++){
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.bottom = '-10px';
                p.style.animationDuration = (10 + Math.random() * 14) + 's';
                p.style.animationDelay = (Math.random() * 14) + 's';
                wrap.appendChild(p);
            }
        })();

        document.getElementById('togglePass').addEventListener('click', () => {
            const input = document.getElementById('password');
            const icon = document.querySelector('#togglePass i');
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            icon.setAttribute('data-lucide', isHidden ? 'eye-off' : 'eye');
            lucide.createIcons();
        });

        function showNotification(message, type = 'error', options = {}) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}${options.celebrate ? ' celebrate' : ''}`;
            const iconName = options.icon || (type === 'success' ? 'check-circle-2' : 'alert-circle');
            const title = options.title || (type === 'success' ? 'Success' : 'Something needs attention');

            toast.innerHTML = `
                <span class="icon"><i data-lucide="${iconName}" style="width:16px;height:16px;"></i></span>
                <div class="body">
                    <p class="title">${title}</p>
                    <p>${message}</p>
                </div>
                <button class="dismiss" aria-label="Dismiss"><i data-lucide="x" style="width:14px;height:14px;"></i></button>
            `;
            container.appendChild(toast);
            lucide.createIcons();
            requestAnimationFrame(() => toast.classList.add('show'));

            let dismissed = false;
            const removeToast = () => {
                if (dismissed) return;
                dismissed = true;
                toast.classList.remove('show');
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            };

            toast.querySelector('.dismiss').addEventListener('click', removeToast);

            let timer = setTimeout(removeToast, options.duration || 4200);
            toast.addEventListener('mouseenter', () => clearTimeout(timer));
            toast.addEventListener('mouseleave', () => { timer = setTimeout(removeToast, 1400); });
        }

        function setFieldError(id, message){
            const input = document.getElementById(id);
            const errorEl = document.querySelector(`[data-error-for="${id}"]`);
            if (message){ input.classList.add('err'); errorEl.textContent = message; }
            else { input.classList.remove('err'); errorEl.textContent = ''; }
        }

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loginBtnLabel = document.getElementById('loginBtnLabel');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            setFieldError('email', '');
            setFieldError('password', '');

            const emailVal = document.getElementById('email').value.trim();
            const passwordVal = document.getElementById('password').value;

            let hasError = false;
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)){ setFieldError('email', 'Enter a valid email address.'); hasError = true; }
            if (passwordVal.length < 6){ setFieldError('password', 'At least 6 characters.'); hasError = true; }
            if (hasError){
                showNotification("Check the highlighted fields and try again.");
                return;
            }

            loginBtn.disabled = true;
            loginBtnLabel.innerHTML = '<span class="spinner"></span> Verifying&hellip;';

            const liveUrl = 'https://bigoticdata-backend.onrender.com/login';

            try {
                const response = await fetch(liveUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailVal, password: passwordVal })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('user', JSON.stringify(data));

                    showNotification("Identity verified. Redirecting you to your dashboard now.", "success", {
                        title: "Login successful",
                        icon: "shield-check",
                        celebrate: true,
                        duration: 2200
                    });

                    // swap the loader to a success state, then transition
                    document.getElementById('loaderMark').outerHTML = '<div class="loader-check" id="loaderMark"><i data-lucide="check" style="width:28px;height:28px;"></i></div>';
                    document.querySelector('.wave-bars').style.display = 'none';
                    document.getElementById('loader-status-text').innerText = "Loading account panel\u2026";
                    lucide.createIcons();
                    document.getElementById('brand-loader-overlay').classList.add('on');

                    setTimeout(() => { window.location.href = "dashboard.html"; }, 1900);
                } else {
                    showNotification(data.error || "Authentication failed. Double-check your email and password.");
                    loginBtnLabel.innerText = "Login to dashboard";
                    loginBtn.disabled = false;
                }
            } catch (err) {
                console.error("LOGIN SYSTEM NETWORK FAILURE:", err);
                showNotification("Unable to reach the authentication server. Please retry shortly.");
                loginBtnLabel.innerText = "Login to dashboard";
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
